# ============================================
# PawCare Application Configuration
# ============================================

# Server
server.port=8080
spring.application.name=PawCare

# Database (MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pawcare_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=root
spring.datasource.password=Jeewantha123
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:PawCareSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLongForHS256Algorithm2024}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Mail (Gmail SMTP - configure with your credentials)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload.dir=uploads

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Payment (Simulated)
app.payment.stripe-secret-key=sk_test_simulated
app.payment.currency=USD

# App Settings
app.frontend.url=http://localhost:8080
app.default-page-size=10

# Private medical/message attachments (not exposed by WebConfig)
app.private-upload.dir=private-uploads
