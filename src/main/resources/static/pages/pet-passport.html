<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="preload" href="/vendor/fonts/font-5.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/vendor/fonts/font-11.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/vendor/fonts/font-17.woff2" as="font" type="font/woff2" crossorigin>
<link href="/vendor/fonts/fonts.css?v=20261015-6" rel="stylesheet">
<link href="/css/design.css?v=20261015-10" rel="stylesheet">
  <title>Digital Pet Passport - PawCare</title>
  <link href="/vendor/bootstrap/bootstrap.min.css?v=5.3.2" rel="stylesheet">
  <link href="/vendor/bootstrap-icons/bootstrap-icons.css?v=1.11.2" rel="stylesheet">
  <link href="/css/style.css?v=20261015-10" rel="stylesheet">
  <link href="/css/passport.css?v=20261015-10" rel="stylesheet"><link rel="icon" href="/images/paw.svg" type="image/svg+xml">
<link href="/css/navigation.css?v=20261016-2" rel="stylesheet">
<link rel="stylesheet" href="/css/site-fixes.css?v=20261015-26">
<link href="/css/page-loading.css?v=20261015-10" rel="stylesheet">
<link href="/css/paw-cursor.css?v=20261015-20" rel="stylesheet">
<link href="/css/workspace-polish.css?v=20261015-20" rel="stylesheet">
</head>
<body class="passport-public has-shared-nav">
<script src="/js/page-loading.js?v=20261015-20"></script>
<script src="/js/paw-cursor.js?v=20261015-20"></script>
<nav id="mainNavbar" aria-label="Main navigation"><a href="/">PawCare</a></nav>
<script src="/js/navigation.js?v=20261016-2"></script>
  <main class="passport-public-shell">
    <a class="passport-public-brand" href="/"><img src="/images/paw.svg" alt=""><span>PawCare · Digital Pet Passport</span></a>
    <div id="passportHost" class="passport-error"><div class="spinner-border" role="status" aria-label="Loading"></div><p class="mt-3 mb-0 text-muted">Opening pet passport…</p></div>
  </main>
<script>
(()=>{
  const host=document.getElementById('passportHost'),params=new URLSearchParams(location.search),token=params.get('p')||params.get('token');
  const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const fmt=d=>{if(!d)return 'Not recorded';const x=new Date(d+'T00:00:00');return Number.isNaN(x.getTime())?esc(d):x.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});};
  const line=v=>v?esc(v):'Not provided';
  function error(message){host.className='passport-error';host.innerHTML=`<i class="bi bi-shield-x" style="font-size:2rem;color:#75579f"></i><h1 class="h4 fw-bold mt-3">Passport unavailable</h1><p class="text-muted mb-0">${esc(message)}</p>`;}
  function render(p){document.title=`${p.petName} · Digital Pet Passport`;const meta=[p.species,p.breed,p.gender&&p.gender.toLowerCase(),p.color&&`${p.color}`].filter(Boolean).map(esc).join(' · ');const owner=p.ownerContact?`<section class="passport-info"><h2><i class="bi bi-person-heart me-1"></i>Owner contact</h2><p><strong>${line(p.ownerContact.name)}</strong>${p.ownerContact.phone?'<br>'+esc(p.ownerContact.phone):''}${p.ownerContact.email?'<br>'+esc(p.ownerContact.email):''}</p><div class="passport-contact-actions">${p.ownerContact.phone?`<a href="tel:${encodeURIComponent(p.ownerContact.phone)}"><i class="bi bi-telephone"></i>Call owner</a>`:''}${p.ownerContact.email?`<a href="mailto:${encodeURIComponent(p.ownerContact.email)}"><i class="bi bi-envelope"></i>Email owner</a>`:''}</div></section>`:'';const vet=p.emergencyVet?`<section class="passport-info"><h2><i class="bi bi-heart-pulse me-1"></i>Emergency veterinarian</h2><p><strong>${line(p.emergencyVet.name)}</strong>${p.emergencyVet.qualification?'<br>'+esc(p.emergencyVet.qualification):''}${p.emergencyVet.specialty?'<br>'+esc(p.emergencyVet.specialty):''}${p.emergencyVet.organization?'<br>'+esc(p.emergencyVet.organization):''}${p.emergencyVet.phone?'<br>'+esc(p.emergencyVet.phone):''}</p>${p.emergencyVet.phone?`<div class="passport-contact-actions"><a href="tel:${encodeURIComponent(p.emergencyVet.phone)}"><i class="bi bi-telephone"></i>Call veterinarian</a></div>`:''}</section>`:'';const vaccines=Array.isArray(p.vaccinations)&&p.vaccinations.length?`<section class="passport-info full"><h2><i class="bi bi-shield-check me-1"></i>Vaccination summary</h2>${p.vaccinations.map(v=>`<div class="passport-vaccine-row"><span><strong>${esc(v.vaccineName)}</strong><small class="d-block">Given ${fmt(v.dateAdministered)}</small></span><small>${v.nextDueDate?'Next due '+fmt(v.nextDueDate):'No due date recorded'}</small></div>`).join('')}</section>`:'';
    host.className='passport-public-card';host.innerHTML=`<header class="passport-public-hero">${p.photo?`<img class="passport-public-photo" src="${esc(p.photo)}" alt="${esc(p.petName)}">`:'<div class="passport-public-photo passport-public-photo-fallback">🐾</div>'}<div><span class="passport-public-badge"><i class="bi bi-patch-check-fill"></i>PawCare Digital Pet Passport</span><h1>${esc(p.petName)}</h1><div class="passport-public-meta">${meta||'Pet profile'}</div>${p.microchipId?`<div class="mt-2 small"><strong>Microchip:</strong> ${esc(p.microchipId)}</div>`:''}</div></header><div class="passport-public-body">${p.allergies?`<section class="passport-info"><h2><i class="bi bi-exclamation-diamond me-1"></i>Known allergies</h2><p>${esc(p.allergies)}</p></section>`:''}${p.medicalWarnings?`<section class="passport-info"><h2><i class="bi bi-activity me-1"></i>Important medical warnings</h2><p>${esc(p.medicalWarnings)}</p></section>`:''}${owner}${vet}${vaccines}${!p.allergies&&!p.medicalWarnings&&!owner&&!vet&&!vaccines?'<section class="passport-info full"><h2>Emergency profile</h2><p>The owner has chosen not to share additional emergency details publicly.</p></section>':''}</div><footer class="passport-public-foot"><i class="bi bi-info-circle me-1"></i>This page is a read-only emergency profile controlled by the pet owner. It may not contain the pet's complete medical history and does not replace veterinary records or professional assessment.</footer>`;}
  if(!token){error('The QR link is missing its passport token.');return;}fetch('/api/passports/'+encodeURIComponent(token),{headers:{Accept:'application/json'}}).then(async r=>{if(!r.ok)throw new Error(r.status===404?'This passport is disabled, expired, or not available.':'Unable to load this passport right now.');return r.json();}).then(render).catch(e=>error(e.message));
})();
</script>
<script src="/vendor/bootstrap/bootstrap.bundle.min.js?v=5.3.2"></script>
<script src="/js/api.js?v=20261016-2"></script>
<script src="/js/ui.js?v=20261015-5"></script>
<script src="/js/site-shell.js?v=20261014-5"></script>
</body>
</html>
